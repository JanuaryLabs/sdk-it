name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true
      NX_DAEMON: false
      VITE_SPEC: ${{ github.workspace }}/packages/apiref/openapi.ci.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:data
      - run: npm run check:links
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:packages
      - run: npm run build
