name: Release

# Releases each push to main and does not wait for CI (Ezz, 2026-11-22: "I want
# the path where release reach npm asap"; zukhruf's root ADRs 0007 and 0008).
# nx-release-version writes the versions into the runner's checkout only: it
# commits, tags and pushes nothing. release-tag then makes release/<version>
# on the pushed commit through the GitHub API, and nx-release-publish publishes
# what was built from it. So nothing reaches npm without its tag, a version
# already on npm is skipped, and a push with nothing to release changes nothing.
on:
  push:
    branches: [main]

# A release is never cancelled: one stopped between the tag and the publish
# would leave a version unpublished. The pushes that arrive during a release
# wait as one pending run, and a newer push replaces it, so the newest push
# releases every commit since the last release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # release-tag creates refs/tags/release/<version> through the API.
      contents: write
      id-token: write
    # The release restores the npm cache but never writes one.
    cache-mode: read
    steps:
      # The tags come with the history: Nx counts the commits since the newest
      # release tag that the pushed commit holds. The job pushes nothing, so the
      # checkout keeps no credentials.
      - name: Checkout the pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the workspace
        uses: JanuaryLabs/zukhruf/.github/actions/setup-workspace@main
        with:
          registry-url: https://registry.npmjs.org/

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # The preVersionCommand of the release block in nx.json builds the
      # tag:npm:public packages.
      - name: Version the pushed commit
        id: version
        uses: JanuaryLabs/zukhruf/.github/actions/nx-release-version@main

      - name: Tag the pushed commit
        if: steps.version.outputs.version != '' && steps.version.outputs.tagged == 'false'
        uses: JanuaryLabs/zukhruf/.github/actions/release-tag@main
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Publish
        if: steps.version.outputs.version != ''
        uses: JanuaryLabs/zukhruf/.github/actions/nx-release-publish@main
        with:
          token: ${{ secrets.NPM_ACCESS_TOKEN }}
